<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Malgun Gothic, 맑은 고딕, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <title>「돌봄이음」 추진내용 한눈에 보기</title>

  <defs>
    <linearGradient id="gAI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>

  <!-- ============ HEADER ============ -->
  <rect x="56" y="32" width="10" height="74" rx="5" fill="#0f8a7e"/>
  <text x="84" y="66" font-size="38" font-weight="bold" fill="#10334d">「돌봄이음」 추진내용 한눈에 보기</text>
  <text x="86" y="99" font-size="19" fill="#5b6b7c">방문 직후 30초 음성 구술 → AI 기록 초안 · 인수인계 브리핑 · 이상징후 알림</text>
  <text x="1544" y="60" font-size="15" fill="#8ba4b8" text-anchor="end">광주다움 통합돌봄 현장인력 대상</text>
  <text x="1544" y="84" font-size="15" fill="#8ba4b8" text-anchor="end">70개 기관 · 1,200여 명 협업 구조</text>

  <!-- ============ BAND A : 기능 + 기술 ============ -->
  <rect x="56" y="140" width="1488" height="480" rx="18" fill="#f5f8fb" stroke="#dde6ee"/>
  <rect x="80" y="162" width="446" height="34" rx="17" fill="#10334d"/>
  <text x="100" y="185" font-size="17" font-weight="bold" fill="#ffffff">가 · 나.  MVP 핵심 기능 3종 &amp; 기술구현</text>

  <!-- C1 : 입력 -->
  <rect x="92" y="232" width="280" height="300" rx="14" fill="#ffffff" stroke="#cfdbe6"/>
  <text x="112" y="264" font-size="13" font-weight="bold" fill="#0f8a7e" letter-spacing="1.5">STEP 1 · 입력</text>
  <circle cx="232" cy="322" r="34" fill="#e7f3f1"/>
  <rect x="225" y="303" width="14" height="24" rx="7" fill="#0f8a7e"/>
  <path d="M217 325 a15 15 0 0 0 30 0" fill="none" stroke="#0f8a7e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M232 340 v9" stroke="#0f8a7e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M223 349 h18" stroke="#0f8a7e" stroke-width="3.5" stroke-linecap="round"/>
  <text x="232" y="399" font-size="23" font-weight="bold" fill="#10334d" text-anchor="middle">방문 직후 30초 구술</text>
  <text x="232" y="426" font-size="15" fill="#7b8b9c" text-anchor="middle">모바일 웹 · 앱 설치 불필요</text>
  <text x="114" y="462" font-size="14.5" fill="#42556a">· 돌봄인력 본인이 직접 구술</text>
  <text x="114" y="487" font-size="14.5" fill="#42556a">· 별도 입력 절차 최소화</text>
  <text x="114" y="512" font-size="14.5" fill="#42556a">· 실패 시 텍스트 직접 입력</text>

  <path d="M378 368 L400 382 L378 396 Z" fill="#8ba4b8"/>

  <!-- C2 : STT -->
  <rect x="412" y="232" width="240" height="300" rx="14" fill="#ffffff" stroke="#cfdbe6"/>
  <text x="432" y="264" font-size="13" font-weight="bold" fill="#14567a" letter-spacing="1.5">STEP 2 · 변환</text>
  <circle cx="532" cy="322" r="34" fill="#e3eef5"/>
  <g stroke="#14567a" stroke-width="4" stroke-linecap="round">
    <path d="M514 318 v8"/><path d="M523 310 v24"/><path d="M532 302 v40"/>
    <path d="M541 308 v28"/><path d="M550 316 v12"/>
  </g>
  <text x="532" y="399" font-size="23" font-weight="bold" fill="#10334d" text-anchor="middle">한국어 STT</text>
  <text x="532" y="426" font-size="15" fill="#7b8b9c" text-anchor="middle">음성 → 텍스트</text>
  <text x="434" y="462" font-size="14.5" fill="#42556a">· 어르신 음성이 아닌</text>
  <text x="434" y="484" font-size="14.5" fill="#42556a">  인력 구술을 입력</text>
  <text x="434" y="512" font-size="14.5" fill="#42556a">· 방언·난청 오류 최소화</text>

  <path d="M658 368 L680 382 L658 396 Z" fill="#8ba4b8"/>

  <!-- C3 : AI -->
  <rect x="692" y="232" width="280" height="300" rx="14" fill="url(#gAI)" stroke="#b9d4d1"/>
  <text x="712" y="264" font-size="13" font-weight="bold" fill="#0f8a7e" letter-spacing="1.5">STEP 3 · 생성</text>
  <circle cx="832" cy="322" r="34" fill="#dcefec"/>
  <path d="M830 300 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z" fill="#0f8a7e"/>
  <circle cx="854" cy="301" r="4.5" fill="#0f8a7e"/>
  <text x="832" y="399" font-size="23" font-weight="bold" fill="#10334d" text-anchor="middle">생성형 AI</text>
  <text x="832" y="426" font-size="15" fill="#7b8b9c" text-anchor="middle">구조화 · 요약 · 분류</text>
  <text x="714" y="462" font-size="14.5" fill="#42556a">· 규격 기록 항목에 맞춰</text>
  <text x="714" y="484" font-size="14.5" fill="#42556a">  구조화 (사업안내 준용)</text>
  <text x="714" y="512" font-size="14.5" fill="#42556a">· 다건 기록 시간순 요약</text>

  <path d="M978 368 L1000 382 L978 396 Z" fill="#8ba4b8"/>

  <!-- C4 : 산출 3종 -->
  <text x="1012" y="220" font-size="13" font-weight="bold" fill="#10334d" letter-spacing="1.5">OUTPUT · 산출물 3종</text>

  <rect x="1012" y="232" width="496" height="92" rx="12" fill="#ffffff" stroke="#cfdbe6"/>
  <rect x="1012" y="232" width="6" height="92" rx="3" fill="#0f8a7e"/>
  <circle cx="1048" cy="278" r="17" fill="#e7f3f1"/>
  <text x="1048" y="284" font-size="17" font-weight="bold" fill="#0f8a7e" text-anchor="middle">1</text>
  <text x="1078" y="272" font-size="20" font-weight="bold" fill="#10334d">규격 돌봄기록 초안</text>
  <text x="1078" y="298" font-size="14.5" fill="#5b6b7c">기존 시스템에 복사·붙여넣기 가능한 규격 텍스트</text>

  <rect x="1012" y="336" width="496" height="92" rx="12" fill="#ffffff" stroke="#cfdbe6"/>
  <rect x="1012" y="336" width="6" height="92" rx="3" fill="#14567a"/>
  <circle cx="1048" cy="382" r="17" fill="#e3eef5"/>
  <text x="1048" y="388" font-size="17" font-weight="bold" fill="#14567a" text-anchor="middle">2</text>
  <text x="1078" y="376" font-size="20" font-weight="bold" fill="#10334d">기관 간 인수인계 브리핑</text>
  <text x="1078" y="402" font-size="14.5" fill="#5b6b7c">동일 대상자의 기관별 기록을 시간순 통합·요약</text>

  <rect x="1012" y="440" width="496" height="92" rx="12" fill="#ffffff" stroke="#cfdbe6"/>
  <rect x="1012" y="440" width="6" height="92" rx="3" fill="#d9762b"/>
  <circle cx="1048" cy="486" r="17" fill="#fbeee2"/>
  <text x="1048" y="492" font-size="17" font-weight="bold" fill="#d9762b" text-anchor="middle">3</text>
  <text x="1078" y="480" font-size="20" font-weight="bold" fill="#10334d">이상징후 플래그 · 알림 초안</text>
  <text x="1078" y="506" font-size="14.5" fill="#5b6b7c">약 미복용 · 식사량 감소 · 낙상 · 정서적 위축 등</text>

  <!-- 원칙 note -->
  <rect x="92" y="550" width="1416" height="46" rx="10" fill="#fff8ee" stroke="#f0d9b8"/>
  <circle cx="122" cy="573" r="11" fill="#d9762b"/>
  <text x="122" y="579" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="146" y="579" font-size="15.5" fill="#7a5220">AI 결과는 모두 <tspan font-weight="bold">‘초안’</tspan> — 현장인력이 확인·수정 후 사용하며, 이상징후는 ‘판정’이 아닌 <tspan font-weight="bold">‘확인이 필요한 신호’</tspan>로만 표시합니다.</text>

  <!-- ============ BAND B : 현장검증 ============ -->
  <rect x="56" y="648" width="1488" height="252" rx="18" fill="#f5f8fb" stroke="#dde6ee"/>
  <rect x="80" y="670" width="196" height="34" rx="17" fill="#10334d"/>
  <text x="100" y="693" font-size="17" font-weight="bold" fill="#ffffff">다.  현장검증</text>

  <rect x="92" y="724" width="452" height="152" rx="14" fill="#ffffff" stroke="#cfdbe6"/>
  <text x="116" y="755" font-size="13" font-weight="bold" fill="#8ba4b8" letter-spacing="1.5">01</text>
  <text x="116" y="784" font-size="21" font-weight="bold" fill="#10334d">현행 업무분석</text>
  <text x="116" y="814" font-size="14.5" fill="#42556a">보건복지부 「2026년 노인맞춤돌봄서비스 사업안내」와</text>
  <text x="116" y="836" font-size="14.5" fill="#42556a">광주광역시 「광주다움 통합돌봄 우수사례집」 분석</text>
  <text x="116" y="861" font-size="14.5" fill="#14567a">→ 실제 기록체계에 맞춘 출력 형식 설계</text>

  <path d="M550 794 L572 808 L550 822 Z" fill="#8ba4b8"/>

  <rect x="584" y="724" width="452" height="152" rx="14" fill="#ffffff" stroke="#cfdbe6"/>
  <text x="608" y="755" font-size="13" font-weight="bold" fill="#8ba4b8" letter-spacing="1.5">02</text>
  <text x="608" y="784" font-size="21" font-weight="bold" fill="#10334d">사전 수요조사</text>
  <text x="608" y="814" font-size="14.5" fill="#42556a">돌봄인력 <tspan font-weight="bold" fill="#14567a">20명 이상</tspan> 대상 기록 작성 실태 및</text>
  <text x="608" y="836" font-size="14.5" fill="#42556a">현장 요구사항 조사</text>
  <text x="608" y="861" font-size="14.5" fill="#14567a">→ 기능 우선순위 및 서비스 설계에 반영</text>

  <path d="M1042 794 L1064 808 L1042 822 Z" fill="#8ba4b8"/>

  <rect x="1076" y="724" width="432" height="152" rx="14" fill="#ffffff" stroke="#0f8a7e" stroke-width="1.5"/>
  <text x="1100" y="755" font-size="13" font-weight="bold" fill="#0f8a7e" letter-spacing="1.5">03</text>
  <text x="1100" y="784" font-size="21" font-weight="bold" fill="#10334d">현장 파일럿</text>
  <text x="1100" y="811" font-size="14.5" fill="#42556a">광주 남구 · 노인복지관 · 수행기관 등 협력기관</text>
  <g text-anchor="middle">
    <text x="1156" y="851" font-size="26" font-weight="bold" fill="#0f8a7e">5~10명</text>
    <text x="1156" y="869" font-size="12.5" fill="#7b8b9c">참여 인력</text>
    <text x="1282" y="851" font-size="26" font-weight="bold" fill="#0f8a7e">2주</text>
    <text x="1282" y="869" font-size="12.5" fill="#7b8b9c">실사용 기간</text>
    <text x="1418" y="851" font-size="26" font-weight="bold" fill="#0f8a7e">200건</text>
    <text x="1418" y="869" font-size="12.5" fill="#7b8b9c">누적 기록</text>
  </g>

  <!-- ============ FOOTER : 운영 원칙 ============ -->
  <rect x="56" y="926" width="1488" height="74" rx="14" fill="#10334d"/>
  <path d="M552 948 V978 M1048 948 V978" stroke="#6b93b3" stroke-width="1" opacity="0.55"/>
  <g fill="#ffffff" font-size="16.5" text-anchor="middle">
    <text x="304" y="961" font-weight="bold">기존 기록 시스템 대체 없음</text>
    <text x="800" y="961" font-weight="bold">음성 원본 · 개인식별정보 미저장</text>
    <text x="1296" y="961" font-weight="bold">참여자 사전동의 후 실증</text>
  </g>
  <g fill="#9dbdd4" font-size="13.5" text-anchor="middle">
    <text x="304" y="983">보조도구로 운영 · 이중입력 부담 최소화</text>
    <text x="800" y="983">가명처리 원칙 적용</text>
    <text x="1296" y="983">개인정보 수집·이용 동의 확보</text>
  </g>
</svg>
