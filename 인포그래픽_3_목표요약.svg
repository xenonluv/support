  <text x="762" y="739" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">정성목표 — 행정 부담을 줄여 <tspan fill="#FFC24D">돌봄시간을 확대</tspan>하고, 전국 통합돌봄에 적용 가능한 <tspan fill="#FFC24D">AI 기록·연계 도구의 원형</tspan>을 제시합니다.</text>
