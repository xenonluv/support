  <text x="122" y="92" font-size="15" fill="#5A6472">이중입력 해소</text>

  <!-- 일러스트 : 말하는 돌봄인력 + 음성 말풍선 -->
  <path d="M157 206 a30 26 0 0 1 60 0 z" fill="#1F3864"/>
