  <path d="M1229 178 a11 9 0 0 1 22 0 z" fill="#ffffff"/>
  <text x="1189" y="228" font-size="13.5" fill="#5A6472" text-anchor="middle">위험 신호를 먼저 알려드립니다</text>

  <rect x="984" y="244" width="410" height="116" rx="10" fill="#F2F4F7" stroke="#DCE1E9"/>
  <text x="1008" y="272" font-size="14" font-weight="bold" fill="#8A94A6">현재 (As-Is)</text>
  <text x="1008" y="308" font-size="20" fill="#333333">개인의 판단에 의존</text>
  <text x="1008" y="338" font-size="15" fill="#5A6472">기록에 남아도 놓치기 쉬움</text>

  <path d="M1178 372 L1200 372 L1189 390 Z" fill="#5B2C8D"/>

  <rect x="984" y="402" width="410" height="134" rx="10" fill="#F1EAF9" stroke="#5B2C8D" stroke-width="1.5"/>
  <text x="1008" y="430" font-size="14" font-weight="bold" fill="#5B2C8D">목표 (To-Be)</text>
  <text x="1008" y="468" font-size="22" font-weight="bold" fill="#1A1A1A">AI가 위험신호 표시</text>
  <text x="1008" y="500" font-size="22" font-weight="bold" fill="#1A1A1A">+ 알림 초안 제시</text>
  <text x="1008" y="528" font-size="15" fill="#5B2C8D">‘판정’이 아닌 ‘확인 필요 신호’</text>

  <!-- ==================== 정량목표 KPI ==================== -->
  <rect x="24" y="574" width="1392" height="112" rx="12" fill="#ffffff" stroke="#C9D6EA" stroke-width="1.5"/>
  <g stroke="#DCE4F0" stroke-width="1">
    <path d="M256 604 V670"/><path d="M488 604 V670"/><path d="M720 604 V670"/>
    <path d="M952 604 V670"/><path d="M1184 604 V670"/>
  </g>
  <rect x="48" y="560" width="132" height="30" rx="15" fill="#1F3864"/>
  <text x="114" y="581" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">정량목표</text>
  <g text-anchor="middle">
    <text x="140" y="642" font-size="30" font-weight="bold" fill="#ED7D31">50%↓</text>
    <text x="140" y="669" font-size="15" fill="#5A6472">기록 작성시간 단축</text>
    <text x="372" y="642" font-size="30" font-weight="bold" fill="#1F3864">5~10명</text>
    <text x="372" y="669" font-size="15" fill="#5A6472">파일럿 참여 인력</text>
    <text x="604" y="642" font-size="30" font-weight="bold" fill="#1F3864">2주</text>
    <text x="604" y="669" font-size="15" fill="#5A6472">현장 실사용 기간</text>
    <text x="836" y="642" font-size="30" font-weight="bold" fill="#1F3864">200건+</text>
    <text x="836" y="669" font-size="15" fill="#5A6472">누적 기록 생성</text>
    <text x="1068" y="642" font-size="30" font-weight="bold" fill="#1F3864">80%+</text>
    <text x="1068" y="669" font-size="15" fill="#5A6472">AI 초안 수용률</text>
    <text x="1300" y="642" font-size="30" font-weight="bold" fill="#1F3864">20명+</text>
    <text x="1300" y="669" font-size="15" fill="#5A6472">사전 수요조사</text>
  </g>

