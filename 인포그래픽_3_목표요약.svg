<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" font-family="Malgun Gothic, 맑은 고딕, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <title>3. 제안사업의 목표 요약</title>
  <rect width="1440" height="790" fill="#ffffff"/>

  <!-- ==================== CARD 1 : 기록 ==================== -->
  <rect x="24" y="16" width="450" height="540" rx="14" fill="#ffffff" stroke="#C9D6EA" stroke-width="1.5"/>
