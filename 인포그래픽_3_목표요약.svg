  <!-- 기관 B -->
  <path d="M802 190 a22 18 0 0 1 44 0 z" fill="#17823F"/>
  <rect x="819" y="172" width="10" height="8" fill="#FBDCC4"/>
  <circle cx="824" cy="156" r="17" fill="#FBDCC4"/>
