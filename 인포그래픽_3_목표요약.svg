  <rect x="514" y="244" width="410" height="116" rx="10" fill="#F2F4F7" stroke="#DCE1E9"/>
  <text x="538" y="272" font-size="14" font-weight="bold" fill="#8A94A6">현재 (As-Is)</text>
  <text x="538" y="308" font-size="20" fill="#333333">기관별 기록 단절</text>
  <text x="538" y="338" font-size="15" fill="#5A6472">담당자 교체 시 돌봄 맥락 소실</text>

  <path d="M708 372 L730 372 L719 390 Z" fill="#17823F"/>

  <rect x="514" y="402" width="410" height="134" rx="10" fill="#E8F5EC" stroke="#17823F" stroke-width="1.5"/>
  <text x="538" y="430" font-size="14" font-weight="bold" fill="#17823F">목표 (To-Be)</text>
  <text x="538" y="468" font-size="22" font-weight="bold" fill="#1A1A1A">대상자별 통합</text>
  <text x="538" y="500" font-size="22" font-weight="bold" fill="#1A1A1A">인수인계 브리핑</text>
  <text x="538" y="528" font-size="15" fill="#166B37">기관 연계·사례회의에 바로 활용</text>

  <!-- ==================== CARD 3 : 안전 ==================== -->
  <rect x="964" y="16" width="450" height="540" rx="14" fill="#ffffff" stroke="#C9D6EA" stroke-width="1.5"/>
  <circle cx="1022" cy="72" r="26" fill="#5B2C8D"/>
