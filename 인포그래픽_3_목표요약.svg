  <rect x="44" y="244" width="410" height="116" rx="10" fill="#F2F4F7" stroke="#DCE1E9"/>
  <text x="68" y="272" font-size="14" font-weight="bold" fill="#8A94A6">현재 (As-Is)</text>
  <text x="68" y="308" font-size="20" fill="#333333">메모 후 시스템 재입력</text>
  <text x="68" y="338" font-size="15" fill="#5A6472">수첩 → 기관 시스템 이중 작업</text>

  <path d="M238 372 L260 372 L249 390 Z" fill="#1F3864"/>

  <rect x="44" y="402" width="410" height="134" rx="10" fill="#EAF0FA" stroke="#1F3864" stroke-width="1.5"/>
  <text x="68" y="430" font-size="14" font-weight="bold" fill="#1F3864">목표 (To-Be)</text>
  <text x="68" y="468" font-size="22" font-weight="bold" fill="#1A1A1A">30초 구술 →</text>
  <text x="68" y="500" font-size="22" font-weight="bold" fill="#1A1A1A">기록 초안 자동 생성</text>
  <text x="68" y="528" font-size="15" fill="#3D5A8A">복사·붙여넣기로 기존 서식에 입력</text>

