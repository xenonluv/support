  <path d="M870 487 L881 498 L870 509 L859 498 Z" fill="#ED7D31"/>
  <text x="892" y="504" font-size="15" font-weight="bold" fill="#1F3864">중간발표 (10월)</text>
  <path d="M1338 487 L1349 498 L1338 509 L1327 498 Z" fill="#ED7D31"/>
  <text x="1316" y="504" font-size="15" font-weight="bold" fill="#1F3864" text-anchor="end">성과발표 (11월)</text>

  <!-- ================= FOOTER ================= -->
