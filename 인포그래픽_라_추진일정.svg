  <text x="56" y="323" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="82" y="316" font-size="17" font-weight="bold" fill="#1F3864">기능 ② 인수인계 브리핑</text>
  <text x="82" y="337" font-size="13.5" fill="#5A6472">기관별 기록 통합·요약</text>
  <rect x="956" y="300" width="140" height="34" rx="17" fill="#17823F"/>
  <text x="1026" y="322" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">기능 ② 개발</text>

  <!-- ---- R5 : 6~7주차 ---- -->
  <path d="M44 396 a13 11 0 0 1 24 0 z" fill="#7B8CA6"/>
  <circle cx="56" cy="376" r="14" fill="#FBDCC4"/>
  <ellipse cx="56" cy="364" rx="14.5" ry="7.5" fill="#C7CDD6"/>
  <circle cx="51" cy="376" r="1.7" fill="#33404F"/>
