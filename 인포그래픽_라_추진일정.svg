  <text x="770" y="579" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle"><tspan fill="#FFC24D">기능 ①을 최소 완성요건으로 우선 확보</tspan>한 뒤 ③ · ② 를 순차 추가하는 단계적 개발로 7주 일정 리스크를 최소화합니다.</text>
