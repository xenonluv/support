  <text x="82" y="378" font-size="17" font-weight="bold" fill="#1F3864">현장 파일럿</text>
  <text x="82" y="399" font-size="13.5" fill="#5A6472">돌봄인력 5~10명 실사용 2주</text>
  <rect x="1112" y="362" width="296" height="34" rx="17" fill="#ED7D31"/>
  <text x="1260" y="384" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">현장 파일럿 2주 · 누적 기록 200건</text>

  <!-- ---- R6 : 7주차 ---- -->
  <circle cx="56" cy="441" r="15" fill="#2E5AAC"/>
  <path d="M49 441 l5 5 9 -10" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="440" font-size="17" font-weight="bold" fill="#1F3864">성과 측정 · 개선</text>
  <text x="82" y="461" font-size="13.5" fill="#5A6472">피드백 반영 · 성과발표 자료</text>
  <rect x="1268" y="424" width="140" height="34" rx="17" fill="#2E5AAC"/>
  <text x="1338" y="446" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">성과 정리</text>

  <!-- ================= 마일스톤 ================= -->
  <rect x="24" y="472" width="1392" height="52" fill="#EEF3FA" stroke="#E4E9F2"/>
