  <g font-size="15.5" fill="#333333">
    <text x="528" y="344">· 동일 대상자의 기관별 기록을</text>
    <text x="542" y="366">시간순으로 통합·요약</text>
    <text x="528" y="388">· “지난 2주간 이 어르신에게</text>
    <text x="542" y="410">무슨 일이 있었는가?” 한눈에</text>
  </g>
  <rect x="514" y="428" width="410" height="60" rx="10" fill="#E8F5EC" stroke="#17823F" stroke-width="1.5"/>
