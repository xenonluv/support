  <text x="762" y="875" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 결과는 모두 <tspan fill="#FFC24D">‘초안’</tspan> — 현장인력이 확인·수정 후 사용하며, AI는 위험을 최종 판정하지 않습니다.</text>
