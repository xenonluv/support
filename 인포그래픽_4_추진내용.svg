  <g font-size="15.5" fill="#333333">
    <text x="58" y="344">· 30초 구술 → STT → 생성형 AI</text>
    <text x="58" y="366">· 「노인맞춤돌봄서비스 사업안내」</text>
    <text x="72" y="388">기록 항목에 맞춰 구조화</text>
    <text x="58" y="410">· 복사·붙여넣기 가능한 규격 텍스트</text>
  </g>
  <rect x="44" y="428" width="410" height="60" rx="10" fill="#EAF0FA" stroke="#1F3864" stroke-width="1.5"/>
  <text x="68" y="452" font-size="15.5" font-weight="bold" fill="#1F3864">→ 기존 기록 시스템 대체 없이</text>
  <text x="90" y="474" font-size="15.5" font-weight="bold" fill="#1F3864">이중입력 부담 감소</text>

