  <text x="1030" y="474" font-size="15.5" font-weight="bold" fill="#5B2C8D">‘확인이 필요한 신호’만 제시</text>

  <!-- ==================== 기술구현 ==================== -->
  <rect x="24" y="528" width="1392" height="92" rx="12" fill="#ffffff" stroke="#C9D6EA" stroke-width="1.5"/>
